<script>
    (() => {
      const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":10202372,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
      const threads = false;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      retry.addEventListener('click', () => window.location.reload());
      let failed = false;
      let ready = false;
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        notice.textContent = performance.now() - lastProgressAt >= 30000 ? 'لم يظهر تقدم جديد. يمكنك الانتظار أو إعادة المحاولة.' : 'ما زال التحميل جاريًا…';
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        clearInterval(startupWatch);
        console.error('[game-loading] Startup failed', error);
        loading.hidden = false;
        status.textContent = 'تعذر تحميل الرحلة. حاول مرة أخرى.';
        progress.hidden = true;
        notice.hidden = true;
        retry.hidden = false;
      };
      const startupWatch = setInterval(updateNotice, 1000);
      window.addEventListener('error', event => fail(event.error || new Error('Engine startup error')));
      window.addEventListener('unhandledrejection', event => fail(event.reason || new Error('Engine startup rejected')));
      const onProgress = (current, total) => {
        if (failed || ready) return;
        if (Number.isFinite(current) && current > downloadedBytes) { downloadedBytes = current; lastProgressAt = performance.now(); }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          status.textContent = '正在 تحميل عالم الرحلة…';
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total ? 'يتم تشغيل اللعبة…' : `يتم التحميل… ${Math.floor(current / total * 100)}%`;
      };
      const start = async () => {
        if (failed) return;
        try {
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          clearInterval(startupWatch);
          notice.hidden = true;
          retry.hidden = true;
          requestAnimationFrame(() => requestAnimationFrame(() => { loading.hidden = true; canvas.focus(); }));
        } catch (error) { fail(error); }
      };
      const script = document.createElement('script');
      script.src = 'index.js';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
